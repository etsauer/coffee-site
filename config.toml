baseURL = "http://mre.coffee/"
locale = "en-US"
title = "Mr. E Imbibes"
theme = "mre.theme"

# Hugo 0.91+ blocks unspecified binaries and env vars.
# AsciiDoc is rendered via the asciidoctor gem; GEM_HOME must be passed through.
[security.exec]
allow = ["^(dart-)?sass(-embedded)?$", "^go$", "^git$", "^npx$", "^postcss$", "^asciidoctor$"]
osEnv = ["(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|GEM_.+|BUNDLE_.+|RUBY.+)$"]

[params]

style = "blue"
description = "Specialty Coffee Enthusiast and un-Professional"
copyright = "&copy;2018 Sauer Bros."
homequote = "Pull up a mouth, we're about to drink some coffee."
sidebarAbout = [
  "The ramblings of an I.T. Pro who secretly aspires to be a barista & bartender."
]
mainSections = [
  "coffee",
  "cocktails",
]
# Contact page
   # Since this template is static, the contact form uses www.formspree.io as a
   # proxy. The form makes a POST request to their servers to send the actual
   # email. Visitors can send up to a 1000 emails each month for free.
   #
   # What you need to do for the setup?
   #
   # - set your email address under 'email' below
   # - upload the generated site to your server
   # - send a dummy email yourself to confirm your account
   # - click the confirm link in the email from www.formspree.io
   # - you're done. Happy mailing!
email = "etsauer@gmail.com"

